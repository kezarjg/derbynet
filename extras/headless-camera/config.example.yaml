# DerbyNet Headless Camera Configuration Example

# Required: DerbyNet server URL
server_url: "http://derbynet.local"

# Optional: WebSocket URL (will be auto-detected if not specified)
# websocket_url: "ws://derbynet.local:8080/ws"

# Camera device (default: /dev/video0)
device: "/dev/video0"

# Camera ID for registration (default: camera-replay)
camera_id: "camera-replay"

# Video settings
width: 640
height: 480
framerate: 30

# Polling interval for HTTP signaling in seconds (default: 1.0)
poll_interval: 1.0

# TURN server configuration (optional, for NAT traversal)
# Uncomment and configure if you need TURN relay support
# turn_urls:
#   - "turn:turn.example.com:3478"
#   - "turn:turn.example.com:3478?transport=tcp"
# turn_username: "your-username"
# turn_credential: "your-password"

# Example with a public TURN server (if available):
# turn_urls:
#   - "turn:numb.viagenie.ca:3478"
# turn_username: "webrtc@live.com"
# turn_credential: "muazkh"
